<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP_NAME}}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #edf4f7; background: #1d1f21; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; background: #1d1f21; }
    main { width: min(720px, calc(100vw - 48px)); padding: 48px; text-align: center; }
    .brand-logo { display: block; width: 160px; height: 160px; object-fit: contain; margin: 0 auto 28px; transform: perspective(700px) rotateX(0deg) rotateY(0deg); transform-style: preserve-3d; filter: drop-shadow(0 14px 22px #0008); transition: transform 110ms ease-out; will-change: transform; }
    h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.02; letter-spacing: -.05em; margin: 16px 0; }
    p { color: #a4bac5; font-size: 17px; }
  </style>
</head>
<body>
  <main>
    <img class="brand-logo" src="../assets/PolyNew.png" alt="Poly logo">
    <h1>{{APP_NAME}}</h1>
    <p>Built with Poly and web technologies.</p>
  </main>
  <script>
    const logo = document.querySelector('.brand-logo');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    if (logo) {
      const maxTilt = reduceMotion.matches ? 2 : 9;
      document.addEventListener('pointermove', (event) => {
        const x = (event.clientX / window.innerWidth) * 2 - 1;
        const y = (event.clientY / window.innerHeight) * 2 - 1;
        logo.style.transform = `perspective(700px) rotateX(${-y * maxTilt}deg) rotateY(${x * maxTilt}deg)`;
      }, { passive: true });

      document.addEventListener('pointerleave', () => {
        logo.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg)';
      });
    }
  </script>
</body>
</html>
