[package]
name = "poly-framework"
version = "0.4.10"
edition = "2021"
description = "Experimental custom Rust framework and CLI for building native desktop apps with web frontends"
authors = ["Poly Team"]
repository = "https://github.com/OpenChatGit/Poly"
readme = "README.md"
license-file = "LICENSE"
keywords = ["desktop", "webview", "framework", "native", "cef"]
categories = ["gui", "web-programming"]

[package.metadata.docs.rs]
features = ["experimental-language"]

[dependencies]
# Lexer/Parser
logos = { version = "0.14", optional = true } # Experimental language lexer
# CLI
clap = { version = "4.4", features = ["derive"] }
# Progress output
indicatif = "0.18.6"
# Web interop (WASM)
wasm-bindgen = { version = "0.2", optional = true }
# TTY detection
atty = { version = "0.2", optional = true }
# File watching for hot reload
notify = "7.0"
# HTTP server for dev mode
tiny_http = "0.12"
# URL encoding/decoding
urlencoding = "2.1"
# URL parsing
url = "2.5"
# HTTP client for proxy
ureq = "2.9"
# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Lazy static for global state
lazy_static = "1.4"
once_cell = "1.19"
# Native WebView backend
wry = { version = "0.50", optional = true }
tao = { version = "0.32", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# System tray
tray-icon = { version = "0.14", optional = true }
muda = { version = "0.13", optional = true }
# Native dialogs
rfd = { version = "0.15", optional = true }
# Auto-updater
reqwest = { version = "0.11", features = ["blocking", "json"] }
semver = { version = "1.0", optional = true }
zip = { version = "0.6", optional = true }
self_update = { version = "0.39", optional = true }
# Hashing for lockfile integrity
sha2 = { version = "0.10", optional = true }
# Tarball extraction for npm packages
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
# Regex for pattern matching
regex = { version = "1.10", optional = true }
# Ad blocking engine (Brave's implementation) - latest version
adblock = { version = "0.12", optional = true, default-features = false }
# Parallel processing for filter list downloads
rayon = { version = "1.10", optional = true }
# Clipboard
arboard = { version = "3.4", optional = true }
# Notifications
notify-rust = { version = "4", optional = true }
# SQLite database
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# Windows API for frameless windows
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_UI_Input_KeyboardAndMouse"], optional = true }
# Raw window handle for WebView
raw-window-handle = { version = "0.6", optional = true }
# Optional Chromium Embedded Framework runtime. Kept out of the default native
# build so existing Poly apps do not download/package the large CEF distribution.
cef = { version = "156.2.0", optional = true, default-features = false }
# Window shadows for frameless windows
# Note: Disabled due to raw-window-handle version conflict with tao/wry
# window-shadows = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "experimental-language"]
experimental-language = ["dep:logos", "dep:atty"]
experimental-virtual-drive = ["native"]
native = ["wry", "tao", "image", "rfd", "semver", "zip", "self_update", "tray-icon", "muda", "sha2", "flate2", "tar", "arboard", "notify-rust", "windows", "raw-window-handle", "rusqlite", "regex", "adblock", "rayon"]
# CEF is an explicit renderer backend so projects can opt into CEF distribution
# and its subprocess/runtime requirements without changing the Wry default.
cef = ["native", "dep:cef"]
# Adds CEF's platform runtime bundlers for producing deployable CEF app folders.
cef-build-util = ["cef", "cef/build-util"]
# Enables CEF's shared-texture OSR path for GPU-backed embedding.
cef-osr = ["cef", "cef/accelerated_osr"]
# GUI mode - hides console window on Windows (used for bundled apps)
gui = []

[lib]
name = "poly"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poly"
path = "src/main.rs"
