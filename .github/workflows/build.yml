name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The `poly` crate is the CLI and runtime. It is the crate that broke on
  # Windows when platform code was added without a `cfg` guard, so it gets a
  # full build on every desktop OS rather than a check-only pass.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: macos-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # wry/tao/tray-icon link against GTK, WebKitGTK and libxdo on Linux.
      # These packages must be present before the first `cargo build`.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build -p poly-framework --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test -p poly-framework --target ${{ matrix.target }}

      # `--version` performs a network update check, so `--help` is used as the
      # binary smoke test: it proves the executable links and starts.
      - name: Smoke test the CLI
        run: cargo run -p poly-framework --target ${{ matrix.target }} -- --help

      - name: Build release CLI
        if: github.event_name != 'pull_request'
        run: cargo build --release -p poly-framework --target ${{ matrix.target }}

      - name: Smoke test release CLI and reinit command
        if: github.event_name != 'pull_request'
        run: cargo run --release -p poly-framework --target ${{ matrix.target }} -- reinit --help

      - name: Package Windows CLI
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/poly.exe" "dist/poly-${{ matrix.asset }}.exe"
          Compress-Archive -Path "dist/poly-${{ matrix.asset }}.exe" -DestinationPath "dist/poly-${{ matrix.asset }}.zip"

      - name: Package Linux CLI
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/poly-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" poly

      - name: Package macOS CLI
        if: github.event_name != 'pull_request' && runner.os == 'macOS'
        run: |
          mkdir -p dist
          tar -czf "dist/poly-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" poly

      - name: Upload CLI release asset
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: poly-cli-${{ matrix.asset }}
          path: dist/poly-*
          if-no-files-found: error

  # `poly-ui` is an incomplete prototype excluded from the default build, but it
  # is a workspace member, so it must keep compiling on every platform.
  build-poly-ui:
    name: Build poly-ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build -p poly-ui --target ${{ matrix.target }}

  # A new package version pushed to master creates a GitHub Release only after
  # every platform build and test above has passed. Explicit v* tags work too.
  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [build, build-poly-ui]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download platform CLI binaries
        uses: actions/download-artifact@v4
        with:
          pattern: poly-cli-*
          path: release-assets
          merge-multiple: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $manifest = Get-Content poly/Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"') { throw 'Could not read poly/Cargo.toml package version.' }
          $version = $Matches[1]
          if ($env:GITHUB_REF.StartsWith('refs/tags/v') -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Version tag $env:GITHUB_REF_NAME does not match poly/Cargo.toml version v$version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Skip release if this version already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            "should_release=true" >> $env:GITHUB_OUTPUT
          } elseif ($response.StatusCode -eq 200) {
            "should_release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; skipping duplicate release."
          } else {
            throw "GitHub release lookup failed with HTTP $($response.StatusCode)."
          }

      - name: Verify and package crate
        if: steps.release_check.outputs.should_release == 'true'
        run: cargo package --package poly-framework

      - name: Publish GitHub Release with Cargo package
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Poly v${{ steps.package.outputs.version }}
          body: |
            Poly is an experimental, custom-built Rust framework and command-line tool for creating, developing, building, and running native desktop applications with HTML, CSS, and JavaScript frontends.

            This release is far from production-ready. Features are incomplete and APIs may change. The default Wry CLI/runtime is built for Windows, Linux, and macOS; feature coverage and system requirements vary by OS. See the repository README for setup instructions and current limitations.

            The attached `.crate` file is the Cargo source package. Installing it provides the `poly` command.
            Platform CLI downloads:
            - Windows x64: `poly-windows-x86_64.zip` and `poly-windows-x86_64.exe` (the raw executable is used by the Windows updater)
            - Linux x64: `poly-linux-x86_64.tar.gz` (requires the system WebKitGTK/GTK runtime libraries)
            - macOS Apple Silicon: `poly-macos-aarch64.tar.gz`
            - macOS Intel: `poly-macos-x86_64.tar.gz`

            macOS CLI binaries are not signed or notarized.

            The source `.crate` and CLI binaries were built from the same commit after all supported platform builds and tests passed.
          files: |
            target/package/poly-framework-*.crate
            release-assets/poly-windows-x86_64.exe
            release-assets/poly-windows-x86_64.zip
            release-assets/poly-linux-x86_64.tar.gz
            release-assets/poly-macos-aarch64.tar.gz
            release-assets/poly-macos-x86_64.tar.gz
          fail_on_unmatched_files: true
